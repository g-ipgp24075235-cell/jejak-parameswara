<style>
:root{--ink:#142c35;--gold:#ffd66c;--paper:#fff0c6;--green:#235a44}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#3b786c,#102c36 80%);font-family:Verdana,Arial,sans-serif;color:#fff;display:flex;justify-content:center;padding:10px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #fff}.shell{width:min(980px,100%)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}.brand{font-weight:900;color:#ffe294;text-shadow:2px 3px #432f40;font-size:clamp(14px,2vw,22px)}.topbuttons{display:flex;gap:5px;flex-wrap:wrap}.small{background:#e8cc83;border:3px solid #533e3f;color:#263738;box-shadow:0 3px 0 #342a32;padding:7px 9px;font-weight:800;font-size:11px}.small:active,.pixelbtn:active{transform:translateY(2px);box-shadow:none}.hud{display:flex;justify-content:space-between;gap:6px;align-items:center;background:#112e3a;border:3px solid #eec76c;padding:8px 11px;font-size:clamp(11px,1.6vw,15px);font-weight:bold}.hud span{white-space:nowrap}.screenwrap{position:relative;border:6px solid #413c56;box-shadow:0 0 0 3px #edc574,0 12px 25px #0007;background:#243e48;margin:5px 3px 0}.screen{width:100%;display:block;image-rendering:pixelated;aspect-ratio:16/9;outline:none;background:#87bc83}.dialogue{position:absolute;bottom:8px;left:8px;right:8px;min-height:86px;background:#162c3af2;border:4px solid #f7d780;box-shadow:inset 0 0 0 2px #53787b;padding:9px 12px;display:none;color:#fff8df;z-index:4}.dialogue.on{display:block}.speaker{color:#ffd879;font-weight:900;margin-bottom:4px}.dialogueText{font-size:clamp(12px,1.8vw,17px);line-height:1.45;padding-right:23px}.next{position:absolute;right:10px;bottom:8px;background:#f8d37e;border:2px solid #402b43;font-size:12px;font-weight:bold;padding:5px 8px}.overlay{position:absolute;inset:0;z-index:7;background:#082b36e8;display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}.overlay.hidden{display:none}.panel{width:min(620px,100%);max-height:100%;overflow:auto;border:5px solid #edbe6c;background:linear-gradient(#254f53,#193941);box-shadow:inset 0 0 0 3px #426e65,0 9px #09242c;text-align:center;padding:clamp(12px,3vw,24px)}h1{font-size:clamp(22px,4.2vw,37px);line-height:1.14;color:#ffe089;text-shadow:3px 4px #713e45;margin:9px 0 12px}h2{font-size:clamp(18px,3vw,26px);color:#ffe089;margin:6px 0 12px}.panel p{line-height:1.5;margin:9px 0 16px;font-size:clamp(12px,1.6vw,15px)}.pixelbtn{display:block;width:100%;max-width:440px;margin:9px auto;background:#ffd770;color:#243643;border:3px solid #81563f;box-shadow:0 4px #392d39;padding:12px;font-weight:900;font-size:clamp(12px,1.8vw,16px);white-space:normal}.pixelbtn.secondary{background:#a4e5cd}.pixelbtn:disabled{opacity:.45;cursor:not-allowed}.option{background:#eaf0c7;text-align:left}.bad{color:#ffb9b0}.good{color:#b4f2b9}.hint{background:#123039cc;border:2px solid #e0bf75;padding:8px;font-size:12px;line-height:1.45}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px 0}.instructions{font-size:12px;line-height:1.6;color:#fce7b1}.touch{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,43px);gap:4px;user-select:none}.touch button,.act{border:3px solid #e0c785;background:#234d56;color:white;font-weight:900;font-size:22px;box-shadow:0 3px #142c34;touch-action:none}.touch .up{grid-column:2}.touch .left{grid-column:1;grid-row:2}.touch .down{grid-column:2;grid-row:2}.touch .right{grid-column:3;grid-row:2}.act{height:63px;min-width:80px;font-size:14px;background:#9c5a56}.controls{display:flex;gap:7px;align-items:center}.act{min-width:70px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.carditem{border:3px solid #d4a963;background:#e6ecc9;color:#173e42;padding:11px 6px;font-weight:900;font-size:12px;cursor:pointer;touch-action:manipulation}.carditem.selected{background:#ffd46f;border-color:#fff}.ordered{padding:8px;text-align:left;background:#10323c;border:2px dashed #b8c89a;min-height:45px;line-height:1.8;font-size:12px}.feedback{min-height:24px;font-weight:bold}.pill{display:inline-block;border:2px solid #d9c88a;padding:4px 9px;margin:3px;background:#173c45;color:#ffe49a;font-weight:900}.footer{font-size:11px;color:#d4e2d3;text-align:center;margin:8px}.sparkle{color:#ffe379} @media(max-width:610px){body{padding:5px}.screenwrap{border-width:4px;margin:5px 1px}.dialogue{bottom:3px;left:3px;right:3px;min-height:66px;padding:5px 7px;border-width:2px}.dialogueText{font-size:11px}.speaker{font-size:11px;margin-bottom:1px}.next{padding:3px;font-size:10px;right:4px;bottom:3px}.hud{padding:6px;font-size:10px}.topbuttons .small{font-size:10px;padding:5px}.touch{grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,40px)}.instructions{font-size:10px}.act{min-width:65px}.bottom{gap:3px}.panel{padding:9px}.pixelbtn{padding:9px;margin:6px auto}.overlay{padding:5px}}
.student-form{display:grid;gap:9px;max-width:430px;margin:10px auto;text-align:left}.student-form label{font-size:13px;font-weight:bold;color:#ffe4a1}.student-form input{width:100%;padding:11px;color:#203640;border:3px solid #cda65f;background:#fff9e1;font:inherit;border-radius:4px}.student-tag{font-size:12px;color:#ffd987}.report-line{white-space:pre-wrap;overflow-wrap:anywhere;background:#153843;padding:8px;border:1px solid #cfb976;text-align:left;font-size:12px}.feedback.notice{color:#ffdda1} </style></head><body><div class="shell"><header class="top"><div class="brand">⚔ JEJAK PARAMESWARA · PIXEL RPG</div><div class="topbuttons"><button class="small" id="saveBtn">💾 Simpan</button><button class="small" id="soundBtn">♫ Bunyi ON</button><button class="small" id="restartBtn">↻ Mula Semula</button></div></header><div class="hud"><span id="stageText">📍 Palembang</span><span id="heartsText">❤️❤️❤️</span><span id="crystalText">💎 0/6</span></div><div class="screenwrap"><canvas id="game" class="screen" width="800" height="450" tabindex="0" aria-label="Peta permainan, gerakkan watak untuk meneroka"></canvas><div class="dialogue" id="dialogue"><div class="speaker" id="speaker"></div><div class="dialogueText" id="dialogueText"></div><button class="next" id="nextBtn">SET ▶</button></div><div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div><section class="bottom"><div class="instructions">⌨ WASD / anak panah: bergerak<br>⏎ E: berinteraksi · J / Space: serang<br>📱 Butang arah dan AKSI untuk telefon</div><div class="controls"><div class="touch"><button class="up" data-dir="up" aria-label="Atas">▲</button><button class="left" data-dir="left" aria-label="Kiri">◀</button><button class="down" data-dir="down" aria-label="Bawah">▼</button><button class="right" data-dir="right" aria-label="Kanan">▶</button></div><button class="act" id="actionBtn">AKSI<br>✦</button><button class="act" id="attackBtn" style="background:#a74340">SERANG<br>⚔</button></div></section><div class="footer">Permainan pendidikan Sejarah Tahun 4 · Segala grafik dan bunyi dijana melalui kod tanpa aset luar.</div></div>
<script>
(()=>{'use strict';
const names=['Palembang','Temasik','Muar','Sening Ujong','Muara Sungai Bertam','Melaka'];
const W=800,H=450,canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const $=x=>document.getElementById(x),overlay=$('overlay'),panel=$('panel'),dialog=$('dialogue');const KEY='jejak_parameswara_gba_v1';
// URL Web App untuk menerima keputusan. Gunakan UJI GOOGLE SHEETS pada menu utama untuk ujian.
const REPORT_ENDPOINT='https://script.google.com/macros/s/AKfycbw-DXxki6QGatgUOdoGqw-0j95IuSc8y72WjEr5wOCIPQBni6UslhayYMTP8-zmNq9k/exec';
let data={stage:0,hearts:3,crystals:0,found:[],completed:false,score:null,order:[],pendingBoarding:false},pos={x:110,y:270},dialogQueue=[],afterDialog=null,dialogReturnMode='play',mode='menu',flags={talked:new Set(),collected:new Set(),safe:false,melakaScene:false},enemies=[],keys=new Set(),last=0,elapsed=0,invuln=0,audio=null,musicOn=true,musicTimer=0,stepMusic=0,cutscene=0,cutTime=0,feedback='';
const configs=[
{npcs:[{x:210,y:155,name:'Pengawal',text:['Majapahit mahu menyerang Palembang.','Parameswara cuba membebaskan Palembang daripada jajahan Majapahit.']},{x:520,y:245,name:'Pengikut',text:['Parameswara ialah putera raja kerajaan Melayu dari Palembang.','Selepas serangan Majapahit, kami meninggalkan Palembang dan belayar ke Temasik.']}],prompt:'Ke manakah Parameswara pergi selepas meninggalkan Palembang?',opts:['Temasik','Muar','Melaka'],right:0,need:2},
{npcs:[{x:190,y:185,name:'Temagi',text:['Patik Temagi, wakil kerajaan Siam yang memerintah Temasik.','Kedatangan Parameswara disambut baik. Baginda dibenarkan menetap di Temasik.']},{x:520,y:270,name:'Penduduk',text:['Temasik strategik untuk dijadikan kerajaan.','Parameswara merancang serangan terhadap Temagi. Temagi kemudian dibunuh.','Kerajaan Siam menyediakan kelengkapan peperangan untuk menyerang Parameswara. Baginda berundur ke Muar.']}],prompt:'Ke manakah Parameswara berundur selepas meninggalkan Temasik?',opts:['Palembang','Muar','Melaka'],right:1,need:2},
{npcs:[{x:210,y:135,name:'Pengikut',text:['Lihat! Terdapat banyak biawak di Muar.','Parameswara mendapati Muar tidak sesuai dijadikan pusat pemerintahan.']}],prompt:'Mengapakah Parameswara meninggalkan Muar?',opts:['Terlalu banyak biawak; tidak sesuai dijadikan pusat pemerintahan.','Tiada kapal untuk belayar.','Kerana pokok Melaka telah tumbang.'],right:0,need:1},
{npcs:[{x:490,y:170,name:'Calon Wakil',text:['Patik bersedia menjadi wakil pemerintah di Sening Ujong.','Parameswara melantik seorang wakil pemerintah sebelum belayar ke Muara Sungai Bertam.']}],prompt:'Apakah tindakan penting Parameswara di Sening Ujong?',opts:['Membina istana di Temasik.','Melantik seorang wakil pemerintah.','Menangkap pelanduk putih.'],right:1,need:1},
{npcs:[{x:220,y:180,name:'Nelayan',text:['Selamat datang ke Muara Sungai Bertam.','Baginda singgah di perkampungan nelayan ini. Cari jala, bakul ikan dan perahu.']}],prompt:'Apakah yang dilihat oleh Parameswara di Muara Sungai Bertam?',opts:['Kubu Majapahit.','Sebuah perkampungan nelayan.','Istana kerajaan Siam.'],right:1,need:1},
{npcs:[{x:195,y:155,name:'Pemburu',text:['Parameswara sedang berburu di kawasan berhampiran sungai.','Dekati pokok Melaka. Saksikan pelanduk putih dan anjing perburuan!']}],prompt:'Mengapakah Parameswara menganggap tempat ini bertuah?',opts:['Kerana terdapat kapal yang besar.','Kerana pelanduk putih kecil mengalahkan anjing perburuan yang lebih besar.','Kerana Muar mempunyai banyak biawak.'],right:1,need:1}
];
let followers=[],trail=[],foes=[],slashes=[],battleDone=false,hitCooldown=0,facing={x:1,y:0},transition=0,travelOrigin=0,kickPlayed=false,boatZone={x:584,y:306,w:150,h:96},boardingHintShown=false,boardingWait=0,combatFlash=0;
const items=[{x:340,y:170,label:'Jala'},{x:550,y:155,label:'Bakul ikan'},{x:510,y:315,label:'Perahu'}];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){feedback='Pelayar menyekat simpanan setempat.';}}
function readSave(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Number.isInteger(x.stage)&&x.stage>=0&&x.stage<=6&&x.crystals>=0&&x.crystals<=6){return {...data,...x,found:Array.isArray(x.found)?x.found:[]};}}catch(e){}return null;}
function resetStage(){pos={x:110,y:270};followers=[{x:78,y:298},{x:55,y:305}];trail=[];slashes=[];battleDone=false;foes=(data.stage===0?[{x:490,y:315,hp:3,label:'Askar Majapahit'},{x:610,y:315,hp:3,label:'Askar Majapahit'}]:data.stage===1?[{x:550,y:325,hp:3,label:'Pengawal Siam'},{x:650,y:310,hp:3,label:'Pengawal Siam'}]:[]);foes.forEach(f=>{f.max=f.hp;f.flash=0;f.cool=0;f.homeX=f.x;f.homeY=f.y;});flags={talked:new Set(data.found||[]),collected:new Set(),safe:false,door:false,seen:false,melakaScene:false};enemies=[{x:350,y:220,base:350,range:90,phase:0},{x:535,y:305,base:535,range:70,phase:1.8},{x:610,y:170,base:610,range:55,phase:3.1}];invuln=1.4;dialogQueue=[];afterDialog=null;dialog.classList.remove('on');mode='play';boardingHintShown=false;overlay.classList.add('hidden');updateHud();focusGame();}
function focusGame(){canvas.focus({preventScroll:true});}
function updateHud(){$('stageText').textContent='📍 '+(data.stage<6?names[data.stage]:'Gerbang Kronologi');$('heartsText').textContent='❤️'.repeat(data.hearts)+'🖤'.repeat(3-data.hearts);$('crystalText').textContent='💎 '+data.crystals+'/6';}
function showPanel(html){mode='panel';keys.clear();overlay.classList.remove('hidden');panel.innerHTML=html;}
function btn(label,cb,klass=''){let b=document.createElement('button');b.className='pixelbtn '+klass;b.textContent=label;b.addEventListener('click',()=>{startAudio();cb();});panel.appendChild(b);return b;}
function cleanText(v,max=80){return String(v||'').trim().replace(/[<>\x00-\x1F]/g,'').slice(0,max);}
function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function studentInfo(){showPanel('<h2>📝 Maklumat Murid</h2><p>Isi nama dan kelas sebelum memulakan misi. Maklumat ini disimpan pada peranti ini dan dimasukkan ke dalam laporan keputusan.</p><div class="student-form"><label for="studentName">Nama penuh murid</label><input id="studentName" maxlength="80" autocomplete="name" placeholder="Contoh: Nur Aisyah"><label for="studentClass">Kelas</label><input id="studentClass" maxlength="30" placeholder="Contoh: 4 Wawasan"></div><p id="studentError" class="feedback bad"></p>');
 btn('▶ MULAKAN PENGEMBARAAN',()=>{const nama=cleanText($('studentName').value),kelas=cleanText($('studentClass').value,30);if(!nama||!kelas){$('studentError').textContent='Sila isi NAMA dan KELAS terlebih dahulu.';return;}data={stage:0,hearts:3,crystals:0,found:[],completed:false,score:null,order:[],pendingBoarding:false,nama,kelas,reportSent:false};persist();resetStage();intro();});btn('← KEMBALI KE MENU',menu,'secondary');}
function menu(){const saved=readSave();showPanel('<div class="sparkle">✦ PENGEMBARAAN SEJARAH MELAYU ✦</div><h1>JEJAK PARAMESWARA<br>MISI MENUJU MELAKA</h1><p>Terokai enam lokasi, temui penduduk dan kumpulkan <b>6 Kristal Jejak</b>.</p><div class="hint">🎯 Lengkapkan 6 lokasi dan susun sekurang-kurangnya 5 daripada 6 peristiwa dengan betul.</div>');btn('▶ MULA PERMAINAN BAHARU',studentInfo);if(saved)btn('💾 SAMBUNG PERMAINAN'+(saved.nama?' — '+saved.nama:''),()=>{data=saved;if(!data.nama||!data.kelas){studentInfo();return;}if(data.stage===6||data.completed){data.stage=6;updateHud();if(Number.isInteger(data.score))result(data.score);else chronology();}else if(data.pendingBoarding){travelOrigin=Math.max(0,data.stage-1);startBoarding();}else{resetStage();speak('Pencerita',['Selamat kembali, '+data.nama+'!','Perjalanan diteruskan di '+names[data.stage]+'.']);}},'secondary');btn('🧪 UJI GOOGLE SHEETS (GURU)',teacherTest,'secondary');btn('📖 CARA BERMAIN',()=>{showPanel('<h2>📖 Panduan Pengembara</h2><p><b>Objektif:</b> Kumpul enam Kristal Jejak, kemudian susun sekurang-kurangnya 5 daripada 6 lokasi mengikut urutan betul.</p><div class="hint" style="text-align:left"><b>1. DAFTAR:</b> Isi nama dan kelas, kemudian tekan Mula Permainan.<br><b>2. BERGERAK:</b> Gunakan kekunci arah ↑ ↓ ← → atau W A S D. Pada telefon, tekan butang arah pada skrin.<br><b>3. BERINTERAKSI:</b> Dekati NPC atau objek. Tekan E, Enter atau AKSI. Tekan SET ▶ untuk sambung dialog.<br><b>4. BERTEMPUR:</b> Hadap musuh dan tekan J, Space atau SERANG. Elakkan musuh dan biawak supaya hati tidak berkurang.<br><b>5. SELESAI MISI:</b> Dapatkan petunjuk, selesaikan permainan mini dan pergi ke gerbang emas di sebelah kanan untuk menjawab soalan.<br><b>6. BELAYAR:</b> Selepas mendapat kristal, gerakkan Parameswara melalui jeti ke atas geladak kapal. Tunggu pengikut naik sebelum belayar.<br><b>7. CABARAN AKHIR:</b> Klik enam kad lokasi satu demi satu. Sekurang-kurangnya 5 kad pada tempat yang betul bermakna objektif tercapai.<br><b>8. HANTAR KEPUTUSAN:</b> Selepas cabaran akhir, muat turun laporan keputusan. Jika cikgu telah mengaktifkan Google Sheets, tekan HANTAR KE CIKGU.</div><p>❤️ Anda bermula dengan 3 hati. Jika habis, cuba lagi di lokasi sama. Gunakan Simpan untuk menyimpan kemajuan. Muzik boleh dihidupkan atau dimatikan.</p>');btn('← KEMBALI KE MENU',menu,'secondary');});}
function intro(){speak('Pencerita',['Selamat datang! Kawal Parameswara dan dua pengikutnya dalam pengembaraan sejarah.','Berdiri dekat NPC dan tekan AKSI untuk mendapatkan petunjuk. Tekan SET untuk membaca dialog.','Lawan musuh menggunakan SERANG. Setelah menjawab cabaran, berjalan sendiri ke atas kapal melalui jeti.','Kumpul enam kristal, kemudian susun enam peristiwa mengikut kronologi.']);}
function speak(who,lines,fn){dialogReturnMode=mode==='boarding'?'boarding':'play';dialogQueue=lines.map(t=>({who,text:t}));afterDialog=fn||null;mode='dialog';showDialogue();}
function showDialogue(){if(dialogQueue.length){const q=dialogQueue.shift();$('speaker').textContent=q.who;$('dialogueText').textContent=q.text;dialog.classList.add('on');}else{dialog.classList.remove('on');const cb=afterDialog;afterDialog=null;mode=dialogReturnMode;if(cb)cb();}}
function nextDialogue(){if(mode==='dialog'){sfx(550,.045);showDialogue();}}
function talk(npc,i){if(flags.talked.has(i)){speak(npc.name,['Petunjuk ini telah diperoleh. Ikuti arahan misi di bahagian atas.']);return;}flags.talked.add(i);data.found=[...flags.talked];persist();sfx(760,.12);speak(npc.name,[...npc.text,`Petunjuk dikumpul: ${flags.talked.size}/${configs[data.stage].need}`],()=>{if(data.stage===3)flags.seen=true;if(data.stage===5)flags.seen=true;if(flags.talked.size>=configs[data.stage].need&&data.stage<2)speak('Pencerita',['Petunjuk diperoleh! Halau pengawal musuh dengan butang SERANG sebelum menuju ke gerbang.','Pertempuran ialah mekanik permainan; ikuti fakta sejarah dalam dialog.']);if(data.stage===3&&flags.talked.size>=1)speak('Parameswara',['Beta melantik kamu sebagai wakil pemerintah di Sening Ujong.','Selepas ini, rombongan kita akan belayar ke Muara Sungai Bertam.']);});}
function currentReady(){let s=data.stage;if(s===0||s===1)return flags.talked.size>=2&&foes.every(f=>f.hp<=0);if(s===2)return flags.talked.size>=1&&flags.safe;if(s===3)return flags.talked.size>=1;if(s===4)return flags.talked.size>=1&&flags.collected.size===3;if(s===5)return flags.talked.size>=1&&flags.melakaScene;return false;}
function action(){startAudio();if(mode==='dialog'){nextDialogue();return;}if(mode==='boarding'){speak('Pengikut',[pos.x>545?'Tunggu kedua-dua pengikut naik ke kapal.':'Ikut papan jeti ke kanan, kemudian naik ke geladak kapal.']);return;}if(mode!=='play')return;const s=data.stage;if(s===5&&!flags.melakaScene&&flags.talked.size>=1&&dist(pos,{x:600,y:240})<100){playCutscene();return;}if(s===4){for(let i=0;i<items.length;i++){if(!flags.collected.has(i)&&dist(pos,items[i])<65){flags.collected.add(i);sfx(980,.12);speak('Penemuan',['Anda menemukan '+items[i].label+'! ('+flags.collected.size+'/3)'],()=>{if(flags.collected.size===3)speak('Pencerita',['Semua barangan nelayan ditemui. Pergi ke gerbang emas!']);});return;}}}
const npcs=configs[s].npcs;for(let i=0;i<npcs.length;i++)if(dist(pos,npcs[i])<75){talk(npcs[i],i);return;}
